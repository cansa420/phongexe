    }
    this.table = opts.targetTable || D.targets.table;
    this.ghostAll = !!opts.ghost; // chế độ mô phỏng: không thua, không dừng sớm khi đủ điểm
    this.ghostFrom = opts.ghostFrom == null ? Infinity : opts.ghostFrom; // chỉ bật chế độ trên từ ải số này (0..23)
    this.seed = opts.seed == null ? 1 : opts.seed;
    this.rng = makeRng(this.seed);
    // Bộ bài khởi đầu: mỗi bộ đổi luật một chút để mỗi ván một phong cách (học từ các Deck của Balatro)
    this.deckId = opts.deck || this.config.defaultDeck;
    const dk = this.config.decks[this.deckId];
    if (!dk) throw new Error('Bộ bài không tồn tại: ' + this.deckId);
    this.deckDef = dk;
    let deck = makeDeck();
    if (dk.removeRanks) deck = deck.filter((c) => !dk.removeRanks.includes(c.rank));
    if (dk.allColor) deck = deck.map((c) => ({ ...c, color: dk.allColor }));
    if (dk.randomize) {
      const r2 = makeRng(((this.seed ^ 0x9e3779b9) >>> 0) || 1);
      const ranks = D.ranks.filter((r) => r.perColor > 0).map((r) => r.id);
      deck = deck.map((c, i) => { const rank = r2.pick(ranks); const color = r2.pick(HO); return { id: `${color}-${rank}-r${i}`, color, rank }; });
    }
    this.deck = deck;
    this.money = (this.config.difficulty.startMoney != null ? this.config.difficulty.startMoney : this.config.startMoney) + (dk.money || 0);
    this.slots = this.config.slots + (dk.slots || 0);
    this.charms = [];
    this.consumables = [];
    this.consumableSlots = this.config.consumableSlots || 2;
    this.junkImmune = false;
    this.handLevels = Object.fromEntries(D.hands.map((h) => [h.id, h.locked && this.config.lockHands !== false ? 0 : 1])); // cấp 0 = còn khóa, mở bằng Quẻ
    this.chang = 1;
    this.aiIdx = 0;
    this.history = [];
    this.uidCounter = 1;
    this.thanTaken = [];
    this.shop = null;
    this.thanOffers = null;
    this.lastReward = null;
    this.vouchers = []; this.voucherOffer = null; this.pack = null; this.packReturn = null; this.lastSkip = null; this.pendingInvest = 0;
    const pool = this.rng.shuffle(D.bosses.pool.slice());
    this.bosses = pool.slice(0, this.config.changCount - 1).concat([D.bosses.final]);
    this.startAi();
  }

  // ---- lưu và nạp ván (JSON thuần). Không lưu: rng (lưu riêng trạng thái), config, deckDef, table, cờ mô phỏng (dựng lại từ opts).
  snapshot() {
    const skip = new Set(['rng', 'config', 'deckDef', 'table', 'ghostAll', 'ghostFrom']);
    const state = {};
    for (const k of Object.keys(this)) if (!skip.has(k)) state[k] = this[k];
    return { opts: { seed: this.seed, difficulty: this.difficultyId, deck: this.deckId }, rng: this.rng.getState(), state: JSON.parse(JSON.stringify(state)) };
  }
  static restore(snap) {
    const r = new Run(snap.opts);
    Object.assign(r, JSON.parse(JSON.stringify(snap.state)));
    r.rng.setState(snap.rng);
    if (r.config.lockHands === false) {
      for (const k of Object.keys(r.handLevels)) if (r.handLevels[k] === 0) r.handLevels[k] = 1;
    }
    return r;
  }

  // ---- tiện ích
  bonus(key) { return this.charms.reduce((s, c) => s + (charmDefs[c.id][key] || 0), 0) + this.vouchers.reduce((s, id) => s + (PHU[id][key] || 0), 0) + ((this.deckDef && this.deckDef[key]) || 0); }
  _price(base) {
    const pct = this.vouchers.reduce((s, id) => s + (PHU[id].discountPct || 0), 0);
    return pct ? Math.max(1, Math.ceil(base * (1 - pct / 100))) : base;
  }
  usedSlots() { return this.charms.filter((c) => c.variant !== 'ran').length; }
  levelUp(type) { this.handLevels[type] += 1; } // bộ đang khóa (cấp 0) thì thành cấp 1 = được mở
  unlockedHands() { return D.hands.map((h) => h.id).filter((id) => this.handLevels[id] > 0); }
  lockedHands() { return D.hands.map((h) => h.id).filter((id) => this.handLevels[id] === 0); }
  // chọn n bộ cho Quẻ: luôn có ít nhất 1 bộ đang khóa (nếu còn) để mở dần, còn lại là bộ đã mở để lên cấp
  _queHands(n) {
    const locked = this.rng.shuffle(this.lockedHands()); const open = this.rng.shuffle(this.unlockedHands());
    const out = locked.length ? [locked[0]] : [];
    for (const h of open) if (out.length < n) out.push(h);
    for (const h of locked.slice(1)) if (out.length < n) out.push(h);
    return this.rng.shuffle(out);
  }
  addTempCard(rank) {
    const color = this.rng.pick(HO);
    const card = { id: `tmp-${color}-${rank}-${this.uidCounter++}`, color, rank, tmp: true };
    const d = this.round.draw;
    d.splice(this.rng.int(d.length + 1), 0, card);
  }
  cardChips(card) {
    let v = R[card.rank].chips;
    for (const c of this.charms) { if (this.round && c.uid === this.round.disabledUid) continue; const d = charmDefs[c.id]; if (d.cardChips) v = d.cardChips(card, v, R); }
    return v;
  }
  targetFor(chang, aiIdx) { const base = this.table[chang - 1][aiIdx]; const mul = (this.config.difficulty && this.config.difficulty.targetMul) || 1; return Math.round(base * mul); }

  // ---- bắt đầu một ải
  startAi() {
    const kind = this.config.aiKinds[this.aiIdx];
    const boss = kind === 'trum' ? this.bosses[this.chang - 1] : null;
    const eff = boss ? boss.effect : {};
    const hands = Math.max(1, this.config.hands + this.bonus('handsBonus') - (eff.handsMinus || 0));
    const baseDiscards = this.config.difficulty.discards != null ? this.config.difficulty.discards : this.config.discards;
    const discards = Math.max(0, baseDiscards + this.bonus('discardsBonus') - (eff.discardsMinus || 0));
    const handSize = Math.max(3, this.config.handSize + this.bonus('handSizeBonus') - (eff.handSizeMinus || 0));
    const cards = this.deck.map((c) => ({ ...c }));
    this.round = {
      chang: this.chang, aiIdx: this.aiIdx, kind, boss,
      target: this.targetFor(this.chang, this.aiIdx), score: 0,
      handsMax: hands, handsLeft: hands, discardsLeft: discards, handSize,
      draw: this.rng.shuffle(cards), hand: [], discardPile: [], playedTypes: {}, bestPlay: 0,
      junk: 0,
    };
    this.phase = 'playing';
    const nJunk = this.junkImmune ? 0 : this.junkFor(this.chang, kind);
    for (let i = 0; i < nJunk; i++) {
      const d = this.round.draw;
      d.splice(this.rng.int(d.length + 1), 0, { id: `junk-${this.uidCounter++}`, color: this.rng.pick(HO), rank: 'junk', junk: true });
    }
    this.round.junk = nJunk;
    for (const c of this.charms) { const d = charmDefs[c.id]; if (d.onAiStart) d.onAiStart(this, c.state); }
    this._refill();
    this.round.disabledUid = null; this._rollDisabled();
    this.round.debuffColor = eff.debuffColor ? this.rng.pick(HO) : null;
  }

  // Quân bị trùm vô hiệu: theo loại (Tướng Giặc) hoặc theo màu (Quỷ Nhuộm; quân Linh bị vô hiệu cùng)
  isDebuffed(c) {
    const r = this.round;
    if (!r || !r.boss) return false;
    const e = r.boss.effect;
    if (e.debuffRanks && e.debuffRanks.includes(c.rank)) return true;
    return !!(r.debuffColor && !c.junk && (c.color === r.debuffColor || c.enh === 'linh'));
  }

  // Trùm Ma Trơi: mỗi lượt vô hiệu một bùa ngẫu nhiên
  _rollDisabled() {
    const r = this.round;
    r.disabledUid = null;
    if (r.boss && r.boss.effect.disableCharm && this.charms.length) r.disabledUid = this.rng.pick(this.charms).uid;
  }

  // Ba ải của chặng hiện tại, để vẽ màn chọn ải. Thẻ bỏ qua cố định theo hạt giống nên xem trước được.
  skipTagFor(chang, idx) {
    const kind = this.config.aiKinds[idx];
    if (!this.config.skip.allowed.includes(kind)) return null;
    const rng = makeRng((((this.seed * 31) >>> 0) + chang * 977 + idx * 131) >>> 0);
    return rng.pick(this.config.skip.tags);
  }
  blinds() {
    return this.config.aiKinds.map((kind, idx) => ({
      idx, kind, chang: this.chang,
      target: this.targetFor(this.chang, idx),
      reward: this.config.rewards[kind],
      boss: kind === 'trum' ? this.bosses[this.chang - 1] : null,
      tag: this.skipTagFor(this.chang, idx),
      status: idx < this.aiIdx ? 'done' : idx === this.aiIdx ? 'now' : 'next',
    }));
  }

  // Số quân Tạp lẫn vào bộ bài của một ải: phần nguyên cố định theo chặng, phần lẻ là xác suất thêm một quân.
  junkBase(chang, kind) {
    const d = (this.config.difficulty || {}).junk;
    if (!d || !(d.max > 0) || chang < d.startChang) return 0;
    return Math.min(d.max, (chang - d.startChang + 1) * d.perChang + (kind === 'trum' ? d.bossBonus : 0));
  }
  junkFor(chang, kind) {
    const base = this.junkBase(chang, kind);
    if (base <= 0) return 0;
    return Math.floor(base) + (this.rng.next() < base - Math.floor(base) ? 1 : 0);
  }

  _refill() {
    const r = this.round;
    while (r.hand.length < r.handSize && r.draw.length > 0) r.hand.push(r.draw.pop());
  }

  // ---- xem trước bộ (chưa tính bùa) cho giao diện
  preview(ids) {
    const r = this.round;
    const played = r.hand.filter((c) => ids.includes(c.id));
    if (!played.length) return null;
    const held = r.hand.filter((c) => !ids.includes(c.id));
    const res = this._calc(played, held, true);
    const base = res.steps[0];
    const banStep = res.steps.find((s) => s.kind === 'banned');
    const eff = r.boss ? r.boss.effect : {};
    return {
      type: res.hand.type, level: base.level, cards: res.hand.cards,
      chips: banStep ? banStep.chips : base.chips, mult: banStep ? banStep.mult : base.mult,
      banned: res.banned, estimate: res.score,
      unscored: played.filter((c) => !res.hand.cards.includes(c)).map((c) => c.id),
      debuffed: played.filter((c) => res.hand.cards.includes(c) && this.isDebuffed(c)).map((c) => c.id),
      lockedBetter: this._lockedBetter(played),
    };
  }
  // nếu các quân đang chọn thực ra ghép được một bộ còn khóa mà điểm cao hơn, trả về mã bộ đó (để báo người chơi)
  _lockedBetter(played) {
    const allSame = this.charms.some((c) => charmDefs[c.id].allSameColor);
    const open = detect(played, allSame, this.handLevels);
    const free = detect(played, allSame, null); // bỏ qua khóa, mọi bộ ở cấp 1
    if (free.type !== open.type && this.handLevels[free.type] === 0 && handValue(free.type, free.cards, null) > handValue(open.type, open.cards, this.handLevels)) return free.type;
    return null;
  }

  // ---- tính điểm một lượt đánh. dry = true: chỉ tính thử, không đổi trạng thái bùa
  _calc(played, held, dry) {
    const round = this.round;
    const eff = round.boss ? round.boss.effect : {};
    const debuff = (c) => this.isDebuffed(c);
    const allSame = this.charms.some((c) => charmDefs[c.id].allSameColor);
    const hand = detect(played, allSame, this.handLevels);
    const steps = [];
    const hd = H[hand.type];
    const lvl = Math.max(1, this.handLevels[hand.type] - (eff.armDown ? 1 : 0)); // trùm Tay Gãy hạ 1 cấp
    let chips = hd.chips + (lvl - 1) * hd.lvChips;
    let mult = hd.mult + (lvl - 1) * hd.lvMult;
    steps.push({ kind: 'hand', type: hand.type, level: lvl, dChips: chips, dMult: mult, chips, mult });
    const banned = !!(eff.banHands && eff.banHands.includes(hand.type));
    if (banned && this.config.bossBan === 'zero') {
      steps.push({ kind: 'banned', chips, mult });
      return { hand, steps, chips, mult, score: 0, banned: true, ctx: null, slots: [] };
    }
    if (banned) { // chế độ "half": bộ bị phạt chỉ còn nửa chip và nửa hệ số gốc
      chips = Math.floor(chips / 2); mult = Math.max(1, Math.floor(mult / 2));
      steps.push({ kind: 'banned', chips, mult, dChips: chips - steps[0].chips, dMult: mult - steps[0].mult });
    }
    const stMap = new Map();
    for (const c of this.charms) {
      const d = charmDefs[c.id];
      stMap.set(c.uid, dry && d.onScoredState ? { ...c.state } : c.state);
    }
    const slots = [];
    const off = round.disabledUid;
    this.charms.forEach((c, i) => {
      const d = charmDefs[c.id];
      if (c.uid === off) { slots.push({ charm: c, idx: i, def: {}, st: {}, copy: false, off: true }); return; }
      if (d.copiesRight) {
        const t = this.charms[i + 1];
        const td = t ? charmDefs[t.id] : null;
        if (td && t.uid !== off && !td.noCopy && !td.than) slots.push({ charm: c, idx: i, def: td, st: stMap.get(t.uid), copy: true });
        else slots.push({ charm: c, idx: i, def: {}, st: {}, copy: true });
      } else slots.push({ charm: c, idx: i, def: d, st: stMap.get(c.uid), copy: false });
    });
    const scoring = played.filter((c) => hand.cards.includes(c));
    const heldAct = held.filter((c) => !debuff(c) && !c.junk);
    const ctx = {
      hand, scoring, played, held: heldAct,
      handsLeft: round.handsLeft - 1, discardsLeft: round.discardsLeft, round, run: this,
    };
    const apply = (e, base) => {
      if (!e) return;
      const s = { ...base };
      if (e.chips) { chips += e.chips; s.dChips = e.chips; }
      if (e.mult) { mult += e.mult; s.dMult = e.mult; }
      if (e.xmult) { mult *= e.xmult; s.xMult = e.xmult; }
      s.chips = chips; s.mult = mult;
      steps.push(s);
    };
    // 1) cập nhật trạng thái bùa (chỉ chủ bùa)
    for (const s of slots) if (!s.copy && s.def.onScoredState) s.def.onScoredState(ctx, s.st);
    // 2) từng quân ghi điểm
    for (const card of scoring) {
      if (debuff(card)) { steps.push({ kind: 'card', cardId: card.id, debuffed: true, chips, mult }); continue; }
      let reps = 1; let retrigIdx = null;
      for (const s of slots) {
        if (!s.def.retrigger) continue;
        const n = s.def.retrigger(card, ctx, s.st);
        if (n > 0) { reps += n; if (retrigIdx == null) retrigIdx = s.idx; }
      }
      if (card.seal === 'do') reps += 1; // Triện Đỏ: tính thêm 1 lần
      for (let rep = 0; rep < reps; rep++) {
        if (rep > 0) steps.push({ kind: 'again', cardId: card.id, charmIdx: retrigIdx, n: rep, chips, mult });
        apply({ chips: this.cardChips(card) }, { kind: 'card', cardId: card.id });
        if (card.enh === 'ngoc') apply({ chips: 30 }, { kind: 'enh', enh: 'ngoc', cardId: card.id });
        if (card.enh === 'kim') apply({ mult: 4 }, { kind: 'enh', enh: 'kim', cardId: card.id });
        if (card.enh === 'son') apply({ xmult: 1.5 }, { kind: 'enh', enh: 'son', cardId: card.id });
        if (card.enh === 'luu_ly') apply({ xmult: 2 }, { kind: 'enh', enh: 'luu_ly', cardId: card.id });
        for (const s of slots) if (s.def.perCard) apply(s.def.perCard(card, ctx, s.st), { kind: 'charm', where: 'card', cardId: card.id, charmIdx: s.idx });
      }
    }
    // 3) quân còn trên tay
    for (const card of heldAct) {
      if (card.enh === 'thep') apply({ xmult: 1.5 }, { kind: 'enh', enh: 'thep', where: 'held', cardId: card.id });
      for (const s of slots) if (s.def.perHeld) apply(s.def.perHeld(card, ctx, s.st), { kind: 'charm', where: 'held', cardId: card.id, charmIdx: s.idx });
    }
    // 4) hiệu ứng độc lập, từ trái sang phải; biến thể chất liệu bọc quanh bùa
    for (const s of slots) {
      const v = s.off ? null : s.charm.variant;
      if (v === 'ngoc') apply({ chips: 50 }, { kind: 'variant', variant: v, charmIdx: s.idx });
      if (v === 'vang') apply({ mult: 10 }, { kind: 'variant', variant: v, charmIdx: s.idx });
      if (s.def.onHand) apply(s.def.onHand(ctx, s.st), { kind: 'charm', where: 'hand', charmIdx: s.idx });
      if (v === 'son_mai') apply({ xmult: 1.5 }, { kind: 'variant', variant: v, charmIdx: s.idx });
    }
    const sealMoney = scoring.filter((c) => !debuff(c) && c.seal === 'vang').length * 3;
    const pendMult = !dry && round.pendingMult ? round.pendingMult : 0;
    if (!dry && pendMult) delete round.pendingMult;
    return { hand, steps, chips, mult: mult + pendMult, score: Math.floor(chips * (mult + pendMult)), banned, ctx, slots, sealMoney };
  }

  // Liệt kê các nước đánh hợp lệ "gọn" (mọi quân đánh ra đều ghi điểm), kèm điểm tính thử. Dùng cho bot.
  enumeratePlays() {
    const hand = this.round.hand;
    const allSame = this.charms.some((c) => charmDefs[c.id].allSameColor);
    const out = []; const seen = new Set();
    // Mỗi ứng viên bộ trên cả tay bài là một nước đánh "gọn"; giữ lại nước mà mọi quân đều ghi điểm.
    for (const cand of candidates(hand, allSame)) {
      const played = hand.filter((c) => cand.cards.includes(c));
      const key = played.map((c) => c.id).join(',');
      if (seen.has(key) || played.length > this.config.maxPlay) continue;
      seen.add(key);
      if (detect(played, allSame, this.handLevels).cards.length !== played.length) continue;
      const held = hand.filter((c) => !cand.cards.includes(c));
      const res = this._calc(played, held, true);
      out.push({ ids: played.map((c) => c.id), score: res.score, type: res.hand.type });
    }
    return out;
  }

  // ---- đánh bài
  play(ids) {
    this._need('playing');
    const r = this.round;
    if (!ids.length || ids.length > this.config.maxPlay) throw new Error('Phải chọn từ 1 đến 5 quân');
    if (new Set(ids).size !== ids.length) throw new Error('Quân bị chọn trùng');
    const played = ids.map((id) => r.hand.find((c) => c.id === id)).filter(Boolean);
    if (played.length !== ids.length) throw new Error('Có quân không nằm trên tay');
    const held = r.hand.filter((c) => !ids.includes(c.id));
    const res = this._calc(played, held, false);
    r.acted = true;
    r.score += res.score;
    if (r.freePlay) { delete r.freePlay; } else { r.handsLeft -= 1; }
    r.playedTypes[res.hand.type] = (r.playedTypes[res.hand.type] || 0) + 1;
    r.bestPlay = Math.max(r.bestPlay, res.score);
    const levelsBefore = { ...this.handLevels };
    if (res.ctx) for (const s of res.slots) if (!s.copy && s.def.afterPlay) s.def.afterPlay(res.ctx, s.st, this);
    r.discardPile.push(...played);
    r.hand = held;
    const eff = r.boss ? r.boss.effect : {};
    let hooked = []; let tax = 0;
    if (eff.hookDiscard) {
      for (let i = 0; i < eff.hookDiscard && r.hand.length > 0; i++) { const c = r.hand.splice(this.rng.int(r.hand.length), 1)[0]; r.discardPile.push(c); hooked.push(c.id); }
    }
    if (eff.taxPerCard) { tax = Math.min(this.money, played.length * eff.taxPerCard); this.money -= tax; }
    // Triện Vàng: tiền ngay khi quân ghi điểm. Lưu Ly: mỗi quân ghi điểm 1/4 cơ hội vỡ, mất khỏi bộ bài
    const sealMoney = res.sealMoney || 0; this.money += sealMoney;
    const broken = [];
    for (const c of res.hand.cards) {
      if (c.enh === 'luu_ly' && !this.isDebuffed(c) && this.rng.next() < 0.25) {
        const di = this.deck.findIndex((d) => d.id === c.id);
        if (di >= 0) { this.deck.splice(di, 1); broken.push(c.id); }
      }
    }
    this._refill();
    this._rollDisabled();
    const out = { ...res, ctx: undefined, slots: undefined, total: r.score, outcome: 'continue', hooked, tax, sealMoney, broken };
    out.leveled = Object.keys(this.handLevels).filter((k) => this.handLevels[k] > levelsBefore[k]);
    out.outcome = this._checkEnd();
    return out;
  }

  // ---- bỏ bài
  discard(ids) {
    this._need('playing');
    const r = this.round;
    if (r.discardsLeft <= 0) throw new Error('Hết lượt bỏ bài');
    if (!ids.length || ids.length > this.config.maxPlay) throw new Error('Phải bỏ từ 1 đến 5 quân');
    const cards = r.hand.filter((c) => ids.includes(c.id));
    if (cards.length !== ids.length) throw new Error('Có quân không nằm trên tay');
    r.acted = true;
    r.discardMoney = 0;
    r.discardsLeft -= 1;
    r.hand = r.hand.filter((c) => !ids.includes(c.id));
    for (const c of this.charms) { const d = charmDefs[c.id]; if (d.onDiscard) d.onDiscard(cards, c.state, this); }
    this._refill();
    if (this.charms.some((c) => charmDefs[c.id].flipOnDiscard)) {
      for (const card of cards) {
        if (!card.swapped) { card.color = NEXT_HO[card.color]; card.swapped = true; }
        r.draw.splice(this.rng.int(r.draw.length + 1), 0, card);
      }
    } else r.discardPile.push(...cards);
    return { discarded: cards.map((c) => c.id), money: r.discardMoney || 0 };
  }

  _need(phase) { if (this.phase !== phase) throw new Error(`Sai giai đoạn: đang ở "${this.phase}", cần "${phase}"`); }

  get ghost() { return this.ghostAll || this.chang * 3 - 3 + this.aiIdx >= this.ghostFrom; }

  _checkEnd() {
    const r = this.round;
    if (!this.ghost && r.score >= r.target) return this._winAi('clear');
    const outOfCards = r.hand.length === 0;
    if (r.handsLeft > 0 && !outOfCards) return 'continue';
    // hết lượt (hoặc hết bài)
    if (this.ghost) return this._winAi('ghost');
    if (r.score >= r.target) return this._winAi('clear');
    const saver = this.charms.find((c) => charmDefs[c.id].saveOnFail && r.score >= r.target * charmDefs[c.id].saveOnFail);
    if (saver) {
      this.charms.splice(this.charms.indexOf(saver), 1);
      return this._winAi('saved');
    }
    this.history.push({ chang: r.chang, aiIdx: r.aiIdx, kind: r.kind, boss: r.boss && r.boss.id, target: r.target, score: r.score, outcome: 'lose' });
    this.phase = 'lost';
    return 'lost';
  }

  _winAi(how) {
    const r = this.round;
    const unused = r.handsLeft;
    const base = this.config.rewards[r.kind];
    let extra = 0;
    for (const c of this.charms) {
      const d = charmDefs[c.id];
      if (d.onAiEnd) { const out = d.onAiEnd(this, c.state, r); if (out && out.money) extra += out.money; }
    }
    const icfg = this.config.interest;
    const interest = Math.min(icfg.cap + this.bonus('interestCapBonus'), Math.floor(Math.max(0, this.money) / icfg.per));
    const invest = r.kind === 'trum' ? this.pendingInvest : 0; // Thẻ Đầu Tư trả sau khi hạ trùm
    if (invest) this.pendingInvest = 0;
    const sealLevels = []; // Triện Lam: còn trên tay khi hạ ải thì nâng 1 cấp một bộ ngẫu nhiên
    for (const c of r.hand) if (c.seal === 'lam') { const h = this.rng.pick(this.unlockedHands()); this.levelUp(h); sealLevels.push(h); }
    const total = base + unused * this.config.rewards.perUnusedHand + extra + interest + invest;
    this.money += total;
    this.lastReward = { base, unused, perUnused: this.config.rewards.perUnusedHand, extra, interest, invest, sealLevels, total, how };
    this.history.push({ chang: r.chang, aiIdx: r.aiIdx, kind: r.kind, boss: r.boss && r.boss.id, target: r.target, score: r.score, outcome: how, unused });
    if (r.kind === 'trum') {
      for (const c of this.charms) { const d = charmDefs[c.id]; if (d.onBossWon) d.onBossWon(this, c.state); }
      if (r.chang === this.config.changCount) { this.phase = 'won'; return 'won'; }
      if (this.config.than.afterBossChang.includes(r.chang)) {
        const left = D.charms.filter((c) => c.rarity === 'than' && !this.thanTaken.includes(c.id));
        if (left.length) {
          this.thanOffers = left.slice(0, this.config.than.choices).map((c) => c.id);
          this.phase = 'than';
          return 'than';
        }
      }
    }
    this._enterShop();
    return 'shop';
  }

  // ---- bùa Thần (sau một số ải trùm)
  pickThan(id, replaceUid) {
    this._need('than');
    if (!this.thanOffers.includes(id)) throw new Error('Bùa này không nằm trong lựa chọn');
    if (this.usedSlots() >= this.slots) {
      const i = this.charms.findIndex((c) => c.uid === replaceUid);
      if (i < 0) throw new Error('Hết ô bùa: chọn một bùa để thay');
      this.charms.splice(i, 1);
    }
    this._addCharm(id, null, 0);
    this.thanTaken.push(id);
    this.thanOffers = null;
    this._enterShop();
  }
  skipThan() { this._need('than'); this.thanOffers = null; this._enterShop(); }

  _addCharm(id, variant, price) {
    const d = charmDefs[id];
    const info = CH[id];
    const charm = {
      uid: this.uidCounter++, id, variant: variant || null,
      state: d.init ? { ...d.init } : {},
      sell: Math.max(1, Math.floor((price || (info.rarity === 'than' ? 6 : info.price)) / 2)),
    };
    this.charms.push(charm);
    return charm;
  }

  // ---- chợ
  _enterShop() {
    const freeRerolls = this.charms.reduce((s, c) => s + (charmDefs[c.id].freeRerollBonus || 0), 0);
    this.shop = { offers: [], rerolls: 0, freeRerolls };
    // Mỗi chặng có một Phù; chưa mua thì còn nguyên ở các chợ sau trong chặng
    if (!this.voucherOffer || this.voucherOffer.chang !== this.chang) {
      const left = D.phu.filter((p) => !this.vouchers.includes(p.id));
      this.voucherOffer = left.length ? { chang: this.chang, id: this.rng.pick(left).id, bought: false } : null;
    }
    this._fillShop(true);
    this.phase = 'shop';
  }

  _rollWeighted(pool, weightFn) {
    const total = pool.reduce((s, c) => s + weightFn(c), 0);
    let x = this.rng.next() * total; let pick = pool[pool.length - 1];
    for (const c of pool) { x -= weightFn(c); if (x <= 0) { pick = c; break; } }
    return pick;
  }
  _rollRarity(cands) {
    const w = this.config.shop.rarityWeights;
    return this._rollWeighted(cands, (c) => w[c.rarity]);
  }
  _rollVariant() {
    let y = this.rng.next();
    for (const [v, p] of Object.entries(this.config.shop.variantChance)) { if (y < p) return v; y -= p; }
    return null;
  }

  _fillShop(initial) {
    const cfg = this.config.shop;
    const keep = initial ? [] : this.shop.offers.filter((o) => o.kind === 'pack' || o.kind === 'phu' || o.kind === 'cons');
    const offers = [];
    const owned = new Set(this.charms.map((c) => c.id));
    const pool = D.charms.filter((c) => c.rarity !== 'than' && !owned.has(c.id));
    const taken = new Set();
    const nCharm = cfg.charmOffers + this.bonus('shopCharmBonus');
    for (let i = 0; i < nCharm; i++) {
      const cand = pool.filter((c) => !taken.has(c.id));
      if (!cand.length) break;
      const pick = this._rollRarity(cand);
      taken.add(pick.id);
      const variant = this._rollVariant();
      const base = pick.price + (variant ? cfg.variantSurcharge[variant] : 0);
      offers.push({ uid: this.uidCounter++, kind: 'charm', id: pick.id, variant, base, price: this._price(base) });
    }
    const nQue = cfg.queOffers + this.bonus('shopQueBonus'); const taken2 = new Set();
    const pickQue = (i) => { // còn bộ khóa thì thường ra lá Mở khóa trước (65% lá đầu, 35% các lá sau), còn lại là lá nâng cấp
      const lk = this.lockedHands().filter((h) => !taken2.has(h)); const op = this.unlockedHands().filter((h) => !taken2.has(h));
      const pool = lk.length && (!op.length || this.rng.next() < (i === 0 ? 0.65 : 0.35)) ? lk : (op.length ? op : lk);
      const h = this.rng.pick(pool); taken2.add(h); return h;
    };
    for (let i = 0; i < nQue; i++) {
      offers.push({ uid: this.uidCounter++, kind: 'que', hand: pickQue(i), base: cfg.quePrice, price: this._price(cfg.quePrice) });
    }
    for (let i = 0; i < (cfg.anOffers || 0); i++) {
      const pick = this._rollWeighted(D.an, (a) => a.weight);
      offers.push({ uid: this.uidCounter++, kind: 'an', id: pick.id, base: pick.price, price: this._price(pick.price) });
    }
    const nCons = cfg.consumableOffers || 0;
    if (nCons > 0) {
      const consTaken = new Set(keep.filter((o) => o.kind === 'cons').map((o) => o.id));
      const consPool = D.consumables.filter((c) => !consTaken.has(c.id));
      for (let i = 0; i < nCons && consPool.length; i++) {
        const idx = this.rng.int(consPool.length);
        const pick = consPool.splice(idx, 1)[0];
        offers.push({ uid: this.uidCounter++, kind: 'cons', id: pick.id, base: pick.price, price: this._price(pick.price) });
      }
    }
    if (initial) {
      const packEntries = Object.entries(cfg.packWeights);
      for (let i = 0; i < (cfg.packOffers || 0); i++) {
        const pk = this._rollWeighted(packEntries, ([, v]) => v)[0];
        offers.push({ uid: this.uidCounter++, kind: 'pack', pack: pk, base: cfg.packPrice, price: this._price(cfg.packPrice) });
      }
      const vo = this.voucherOffer;
      if (vo && !vo.bought) offers.push({ uid: this.uidCounter++, kind: 'phu', id: vo.id, base: PHU[vo.id].price, price: PHU[vo.id].price });
    }
    this.shop.offers = keep.concat(offers);
  }

  _reprice() {
    for (const o of this.shop.offers) if (o.kind !== 'phu') o.price = this._price(o.base);
  }

  rerollCost() { return this.config.shop.rerollBase + this.shop.rerolls * this.config.shop.rerollStep; }

  reroll() {
    this._need('shop');
    if (this.shop.freeRerolls > 0) { this.shop.freeRerolls -= 1; this._fillShop(false); return { ok: true }; }
    const cost = this.rerollCost();
    if (this.money < cost) return { ok: false, reason: 'money' };
    this.money -= cost; this.shop.rerolls += 1; this._fillShop(false);
    return { ok: true };
  }

  // ---- Gói: mở ra chọn 1 trong N (hoặc bỏ qua)
  _openPack(o) {
    const cfg = this.config.shop; const n = cfg.packChoices;
    const choices = [];
    if (o.pack === 'bua') {
      const owned = new Set(this.charms.map((c) => c.id));
      let pool = D.charms.filter((c) => c.rarity !== 'than' && !owned.has(c.id));
      for (let i = 0; i < n && pool.length; i++) {
        const pick = this._rollRarity(pool);
        pool = pool.filter((c) => c.id !== pick.id);
        choices.push({ kind: 'charm', id: pick.id, variant: this._rollVariant(), base: pick.price });
      }
    } else if (o.pack === 'quan') { // Gói Quân: thêm 1 quân mới (có thể đã phù phép, đóng triện) vào bộ bài
      const ranks = D.ranks.filter((r) => r.perColor > 0).map((r) => r.id);
      const enhs = Object.keys(this.config.enhancements); const seals = Object.keys(this.config.seals);
      for (let i = 0; i < n; i++) {
        const ch = { kind: 'card', rank: this.rng.pick(ranks), color: this.rng.pick(HO) };
        if (this.rng.next() < 0.45) ch.enh = this.rng.pick(enhs);
        if (this.rng.next() < 0.2) ch.seal = this.rng.pick(seals);
        choices.push(ch);
      }
    } else {
      const hs = this._queHands(n);
      for (const h of hs) choices.push({ kind: 'que', hand: h });
    }
    this.pack = { pack: o.pack, choices };
    this.phase = 'pack';
  }
  pickPack(index, replaceUid) {
    this._need('pack');
    const back = () => { this.pack = null; if (this.packReturn === 'next') { this.packReturn = null; this._nextAi(); } else this.phase = 'shop'; };
    if (index === null || index === undefined) { back(); return { ok: true, skipped: true }; }
    const c = this.pack.choices[index];
    if (!c) throw new Error('Lựa chọn không tồn tại');
    if (c.kind === 'charm') {
      if (c.variant !== 'ran' && this.usedSlots() >= this.slots) {
        const i = this.charms.findIndex((x) => x.uid === replaceUid);
        if (i < 0) throw new Error('Hết ô bùa: chọn một bùa để thay');
        this.charms.splice(i, 1);
      }
      this._addCharm(c.id, c.variant, c.base);
    } else if (c.kind === 'card') {
      const card = { id: `${c.color}-${c.rank}-p${this.uidCounter++}`, color: c.color, rank: c.rank };
      if (c.enh) card.enh = c.enh; if (c.seal) card.seal = c.seal;
      this.deck.push(card);
    } else this.levelUp(c.hand);
    back();
    return { ok: true, picked: c };
  }

  // ---- Ấn: sửa bộ bài vĩnh viễn. targets = mảng id quân trong this.deck
  applyAn(anId, targets) {
    const a = AN[anId];
    if (!a) throw new Error('Không có Ấn này');
    if (!Array.isArray(targets) || targets.length < 1 || targets.length > a.max) throw new Error(`Chọn từ 1 đến ${a.max} quân`);
    const cards = targets.map((id) => this.deck.find((c) => c.id === id));
    if (cards.some((c) => !c) || new Set(targets).size !== targets.length) throw new Error('Quân không hợp lệ');
    if (anId === 'tru_ta' && this.deck.length - cards.length < this.config.minDeck) throw new Error(`Bộ bài không được dưới ${this.config.minDeck} quân`);
    for (const c of cards) {
      if (anId === 'nhan_ban') this.deck.push({ ...c, id: `${c.color}-${c.rank}-x${this.uidCounter++}` });
      else if (anId === 'tru_ta') this.deck.splice(this.deck.indexOf(c), 1);
      else if (anId === 'dao_sac') c.color = NEXT_HO[c.color];
      else if (a.seal) c.seal = a.seal; // triện: một quân một triện, đóng cùng phù phép
      else c.enh = anId; // ngoc | kim | son | thep | linh | luu_ly (thay phù phép cũ nếu có)
    }
  }

  buy(offerUid, targets) {
    this._need('shop');
    const i = this.shop.offers.findIndex((o) => o.uid === offerUid);
    if (i < 0) return { ok: false, reason: 'missing' };
    const o = this.shop.offers[i];
    if (this.money < o.price) return { ok: false, reason: 'money' };
    if (o.kind === 'pack') {
      this.money -= o.price; this.shop.offers.splice(i, 1);
      this._openPack(o);
      return { ok: true, pack: true };
    }
    if (o.kind === 'phu') {
      this.money -= o.price; this.vouchers.push(o.id); this.voucherOffer.bought = true;
      if (PHU[o.id].slotsBonus) this.slots = Math.min(this.config.maxSlots, this.slots + PHU[o.id].slotsBonus);
      if (PHU[o.id].consumableSlotsBonus) this.consumableSlots = Math.min(4, this.consumableSlots + PHU[o.id].consumableSlotsBonus);
      this.shop.offers.splice(i, 1); this._reprice();
      return { ok: true, phu: o.id };
    }
    if (o.kind === 'cons') {
      if (this.consumables.length >= this.consumableSlots) return { ok: false, reason: 'full' };
      this.money -= o.price;
      this.consumables.push({ uid: this.uidCounter++, id: o.id });
      this.shop.offers.splice(i, 1);
      return { ok: true, cons: o.id };
    }
    if (o.kind === 'charm') {
      if (o.variant !== 'ran' && this.usedSlots() >= this.slots) return { ok: false, reason: 'full' };
      this.money -= o.price;
      this._addCharm(o.id, o.variant, o.price);
    } else if (o.kind === 'an') {
      this.applyAn(o.id, targets); // ném lỗi nếu mục tiêu sai, khi đó chưa trừ tiền
      this.money -= o.price;
    } else {
      this.money -= o.price;
      this.levelUp(o.hand);
    }
    this.shop.offers.splice(i, 1);
    return { ok: true };
  }

  sell(charmUid) {
    const i = this.charms.findIndex((c) => c.uid === charmUid);
    if (i < 0) return { ok: false };
    this.money += this.charms[i].sell;
    for (const c of this.charms) { if (c.uid !== charmUid) { const d = charmDefs[c.id]; if (d.onCharmSell) d.onCharmSell(c.state, this); } }
    this.charms.splice(i, 1);
    return { ok: true };
  }

  // Sắp xếp lại thứ tự bùa (thứ tự quyết định thứ tự tính điểm)
  moveCharm(from, to) {
    if (from < 0 || to < 0 || from >= this.charms.length || to >= this.charms.length) return;
    const [c] = this.charms.splice(from, 1);
    this.charms.splice(to, 0, c);
  }

  // ---- bỏ qua Ải Thường / Ải Lớn trước khi đánh: không có tiền thưởng, không vào chợ, đổi lấy Thẻ (xem trước ở màn chọn ải)
  canSkip() {
    const r = this.round;
    return this.phase === 'playing' && !r.acted && this.config.skip.allowed.includes(r.kind);
  }
  skipAi() {
    if (!this.canSkip()) throw new Error('Không bỏ qua được ải này');
    const r = this.round;
    for (const c of this.charms) { const d = charmDefs[c.id]; if (d.onSkip) d.onSkip(c.state, this); }
    const tag = this.skipTagFor(r.chang, r.aiIdx);
    this.history.push({ chang: r.chang, aiIdx: r.aiIdx, kind: r.kind, boss: null, target: r.target, score: 0, outcome: 'skip', unused: 0, tag });
    this.lastSkip = { tag };
    if (tag === 'que') {
      this.skipOffer = this._queHands(this.config.skip.queChoices);
      this.phase = 'skip';
      return { tag, offer: this.skipOffer };
    }
    if (tag === 'goi') { // mở ngay Gói Bùa miễn phí, xong thì sang ải kế
      this.packReturn = 'next'; this._openPack({ pack: 'bua' });
      this.lastSkip = { tag, pack: true }; return this.lastSkip;
    }
    if (tag === 'dautu') {
      this.pendingInvest += this.config.skip.investAmount;
      this.lastSkip = { tag, invest: this.config.skip.investAmount }; this._nextAi(); return this.lastSkip;
    }
    if (tag === 'nhanh') {
      const n = this.history.filter((h) => h.outcome === 'skip').length; const m = n * this.config.skip.speedPer;
      this.money += m; this.lastSkip = { tag, money: m, skips: n }; this._nextAi(); return this.lastSkip;
    }
    if (tag === 'cap') {
      const h = this.rng.pick(this.unlockedHands());
      for (let i = 0; i < this.config.skip.capLevels; i++) this.levelUp(h);
      this.lastSkip = { tag, hand: h, levels: this.config.skip.capLevels }; this._nextAi(); return this.lastSkip;
    }
    if (tag === 'cons') {
      if (this.consumables.length < this.consumableSlots) {
        const pick = this.rng.pick(D.consumables);
        this.consumables.push({ uid: this.uidCounter++, id: pick.id });
        this.lastSkip = { tag, consId: pick.id };
      } else {
        this.money += this.config.skip.moneyTag;
        this.lastSkip = { tag, money: this.config.skip.moneyTag, fallback: true };
      }
      this._nextAi(); return this.lastSkip;
    }
    if (tag === 'bua' && this.usedSlots() < this.slots) {
      const owned = new Set(this.charms.map((c) => c.id));
      const pool = D.charms.filter((c) => c.rarity === 'hiem' && !owned.has(c.id));
      if (pool.length) {
        const pick = this.rng.pick(pool);
        this._addCharm(pick.id, null, pick.price);
        this.lastSkip = { tag, charmId: pick.id };
        this._nextAi();
        return this.lastSkip;
      }
    }
    this.money += this.config.skip.moneyTag; // Thẻ Tiền, hoặc Thẻ Bùa khi đầy ô
    this.lastSkip = { tag, money: this.config.skip.moneyTag, fallback: tag === 'bua' };
    this._nextAi();
    return this.lastSkip;
  }
  pickSkip(hand) {
    this._need('skip');
    if (!this.skipOffer.includes(hand)) throw new Error('Quẻ không nằm trong lựa chọn');
    this.levelUp(hand);
    this.lastSkip = { tag: 'que', hand };
    this.skipOffer = null;
    this._nextAi();
  }

  // Xếp tay bài (thứ tự tay bài cũng là thứ tự tính điểm từ trái sang phải)
  sortHand(mode) {
    const ord = (c) => R[c.rank].order;
    const col = (c) => HO.indexOf(c.color);
    this.round.hand.sort(mode === 'color' ? (a, b) => col(a) - col(b) || ord(b) - ord(a) : (a, b) => ord(b) - ord(a) || col(a) - col(b));
  }

  // ---- dùng vật phẩm tiêu hao. targets = [] hoặc [cardId] nếu target === 'card_hand'
  useConsumable(uid, targets) {
    this._need('playing');
    const i = this.consumables.findIndex((c) => c.uid === uid);
    if (i < 0) throw new Error('Không tìm thấy vật phẩm tiêu hao');
    const cons = this.consumables[i];
    const def = CONS[cons.id];
    const r = this.round;
    if (def.target === 'card_hand') {
      if (!Array.isArray(targets) || targets.length !== 1) throw new Error('Cần chọn 1 quân trên tay');
      if (!r.hand.find((c) => c.id === targets[0])) throw new Error('Quân không ở trên tay');
    }
    const id = cons.id; let result = { ok: true };
    const enhMap = { phu_ngoc: 'ngoc', phu_kim: 'kim', phu_thep: 'thep', phu_son: 'son', phu_linh: 'linh' };
    const sealMap = { phu_trien_do: 'do', phu_trien_vang: 'vang', phu_trien_lam: 'lam' };
    if (enhMap[id]) {
      const enh = enhMap[id]; const cardId = targets[0];
      const hc = r.hand.find((c) => c.id === cardId); if (hc) hc.enh = enh;
      const dc = this.deck.find((c) => c.id === cardId); if (dc) dc.enh = enh;
      result = { ok: true, enh, cardId };
    } else if (sealMap[id]) {
      const seal = sealMap[id]; const cardId = targets[0];
      const hc = r.hand.find((c) => c.id === cardId); if (hc) hc.seal = seal;
      const dc = this.deck.find((c) => c.id === cardId); if (dc) dc.seal = seal;
      result = { ok: true, seal, cardId };
    } else if (id === 'phu_nhan') {
      const cardId = targets[0];
      const hc = r.hand.find((c) => c.id === cardId);
      if (hc && !hc.junk) {
        const copy = { ...hc, id: `${hc.color}-${hc.rank}-x${this.uidCounter++}` };
        delete copy.tmp;
        this.deck.push(copy);
      }
      result = { ok: true, cardId };
    } else if (id === 'phu_tay') {
      r.hand = r.hand.filter((c) => !c.junk);

  // Điều kiện bật chế độ gợi ý: Dễ + Bộ Chuẩn + chặng 1-2
  function isHintMode() {
    return !!(run && run.difficultyId === 'de' && run.deckId === 'chuan' && run.chang <= 2);
  }
  // Trả về Set id các lá trên tay sẽ cải thiện bộ khi thêm vào (1–4 lá đang chọn)
  function getHintCards() {
    if (!isHintMode() || ui.sel.size === 0 || ui.sel.size >= 5 || !run.round || run.phase !== 'playing') return new Set();
    const sel = [...ui.sel];
    const ord = DATA.hands.map((h) => h.id); // mạnh → yếu, index nhỏ = mạnh hơn
    const curIdx = ord.indexOf(run.preview(sel).type);
    const hinted = new Set();
    for (const c of run.round.hand) {
      if (ui.sel.has(c.id) || c.rank === 'junk' || c.rank === 'n10') continue;
      if (ord.indexOf(run.preview([...sel, c.id]).type) < curIdx) hinted.add(c.id);
    }
    return hinted;
  }

  function calcState() {
    if (ui.sel.size && run.round && run.phase === 'playing') {
      const p = run.preview([...ui.sel]);
      const warns = [];
      if (p.unscored.length) warns.push(`${p.unscored.length} quân ngoài bộ, không ghi điểm`);
      if (p.banned) warns.push('Trùm phạt bộ này: còn nửa chip, nửa hệ số');
      if (p.debuffed.length) warns.push(`${p.debuffed.length} quân bị trùm vô hiệu`);
      if (p.lockedBetter) warns.push(`🔒 Đủ quân cho <b>${H[p.lockedBetter].vi}</b> nhưng bộ này chưa mở khóa`);
      const est = `Cấp ${p.level} · dự kiến <b class="est">${fmt(p.estimate)}</b> điểm (đã tính bùa)`;
      return { name: H[p.type].vi, sub: warns.length ? `<span class="warn">${warns.join('. ')}</span><br>${est}` : est, chips: p.chips, mult: p.mult, tier: HAND_TIER[p.type] };
    }
    return { name: 'Chọn quân để đánh', sub: 'Tối đa 5 quân', chips: 0, mult: 0, tier: '' };
  }

  // Lá đã chọn bay lên bàn đánh, bỏ chọn thì bay về chỗ cũ; các lá còn lại xô lại theo.
  function playCardsHTML() {
    const r = run.round;
    const inHand = ui.layout === 'port'; // màn dọc: lá được chọn nhô cao và tỏa sáng ngay trong tay bài, không bay lên bàn
    const picked = inHand ? [] : r.hand.filter((c) => ui.sel.has(c.id));
    const rest = inHand ? r.hand : r.hand.filter((c) => !ui.sel.has(c.id));
    const nH = rest.length;
    const hintSet = getHintCards();
    const hand = rest.map((c, i) => { const off = i - (nH - 1) / 2; return cardHTML(c, { act: true, sel: inHand && ui.sel.has(c.id), isNew: !ui.known.has(c.id), cls: ui.stage && !ui.known.has(c.id) ? 'hold' : '', delay: i * 45, fan: { rot: off * 2.2, ty: Math.pow(Math.abs(off), 1.7) * 1.4 }, hint: hintSet.has(c.id) }); }).join('');
    const stage = picked.map((c) => cardHTML(c, { act: true, sel: true })).join('');
    return { stage, hand };
  }
  // Dựng lại bàn đánh và tay bài rồi chạy hoạt ảnh bay (FLIP) từ vị trí cũ sang vị trí mới của từng lá.
  function syncCards() {
    const first = new Map();
    $$('#hand .card, #stage .card').forEach((el) => first.set(el.dataset.id, el.getBoundingClientRect()));
    const { stage, hand } = playCardsHTML();
    const hint = '<div class="hint">Chạm lá để chọn (tối đa 5), rồi bấm Đánh. Chỉ lá thuộc bộ mới ghi điểm; lá còn trên tay có thể kích hoạt bùa.</div>';
    $('#stage').innerHTML = stage || hint; $('#hand').innerHTML = hand;
    fit();
    if (REDUCED) return;
    $$('#hand .card, #stage .card').forEach((el) => {
      const a = first.get(el.dataset.id); if (!a) return;
      const b = el.getBoundingClientRect(); if (!b.width) return;
      const dx = a.left + a.width / 2 - (b.left + b.width / 2); const dy = a.top + a.height / 2 - (b.top + b.height / 2); const s = a.width / b.width;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(s - 1) < 0.02) return;
      el.classList.remove('new'); el.style.animation = 'none'; el.style.zIndex = 8;
      const an = el.animate([{ translate: dx + 'px ' + dy + 'px', scale: String(s) }, { translate: '0px 0px', scale: '1' }], { duration: FAST ? 10 : 260, easing: 'cubic-bezier(.2,.8,.3,1)' });
      an.onfinish = () => { el.style.zIndex = ''; };
    });
  }

      const info = CFG.aiNames[b.kind];

  function viewPack() {
    const pk = run.pack; const isBua = pk.pack === 'bua';
    const cards = pk.choices.map((c, i) => {
      let face;
      if (c.kind === 'charm') {
        const info = CH[c.id]; const fake = { uid: 'p' + i, id: c.id, variant: c.variant, state: {} };
        const v = c.variant ? `<b>${CFG.variants[c.variant].vi}:</b> ${CFG.variants[c.variant].text}. ` : '';

      } else if (c.kind === 'card') {
        const card = { id: 'pk' + i, color: c.color, rank: c.rank, enh: c.enh, seal: c.seal };
        const line = (img, name, text) => `<div class="pkline"><img class="px" src="${img}" alt="" draggable="false"><div><b>${name}</b><span>${text}</span></div></div>`;
        const lines = [c.enh ? line(`assets/an/${c.enh}.png`, CFG.enhancements[c.enh].vi, CFG.enhancements[c.enh].text) : '', c.seal ? line(`assets/an/trien_${c.seal}.png`, CFG.seals[c.seal].vi, CFG.seals[c.seal].text) : ''].filter(Boolean).join('');
        face = `<div class="pk-card">${cardHTML(card, {})}</div><div class="desc pkdesc"><b class="pkname">${cardName(c)} ${HO_VI[c.color]}</b>${lines || '<span class="pkplain">Lá thường, không phù phép.</span>'}</div>`;
      } else {
        const h = H[c.hand]; const lv = run.handLevels[c.hand];
        face = `<div class="que"><b>Quẻ<br>${h.vi}</b><span class="lv">${queLv(c.hand)}</span></div><div class="desc">${queDesc(c.hand)}</div>`;
      }
      return `<div class="offer pcard" style="--i:${i}"><div class="flipin">${face}<button class="buy" data-act="pack-pick" data-i="${i}" type="button">Chọn</button></div></div>`;
    }).join('');
    const replacing = ui.packPick != null;
    return `${topHTMLFor(ui.cashout || { chang: run.chang, kind: 'thuong' })}
      <div class="panel cash"><small>Gói vừa mở</small><div class="big">${PACK_NAME[pk.pack]}</div><p>${replacing ? 'Ô bùa đã đầy: chạm một bùa của bạn để thay bằng lựa chọn này.' : 'Chọn một món, hoặc bỏ qua nếu không ưng.'}</p></div>
      <div class="offers packrow">${cards}</div>
      ${replacing ? `<div class="panel shop-sec"><h3>Thay bùa nào?<span class="reward">chạm một bùa</span></h3><div class="charms" style="grid-template-columns:repeat(${run.charms.length},1fr)">${run.charms.map((c, i) => charmHTML(c, i).replace('data-act="charm"', 'data-act="pack-replace"')).join('')}</div><button class="btn discard" data-act="pack-cancel" type="button">Quay lại</button></div>`
        : `<button class="btn discard" data-act="pack-skip" type="button">Bỏ qua Gói</button><div class="panel shop-sec"><h3>Bùa của bạn<span class="reward">${run.usedSlots()}/${run.slots} ô</span></h3>${charmsRowHTML()}</div>`}${overlays()}`;
  }
  function viewSkip() {
    const r = run.round;
    return `${topHTML()}<div class="panel cash"><small>Chặng ${r.chang}/${CFG.changCount}</small><div class="big">Bỏ qua ${CFG.aiNames[r.kind]}</div><p>Chọn một Quẻ miễn phí. Ván đi thẳng tới ải kế tiếp, không qua chợ.</p>
      <div class="offers">${run.skipOffer.map((h) => { return `<div class="offer"><div class="que"><b>Quẻ<br>${H[h].vi}</b><span class="lv">${queLv(h)}</span></div><div class="desc">${queDesc(h)}</div><button class="buy" data-act="skip-pick" data-hand="${h}" type="button">Nhận</button></div>`; }).join('')}</div></div>${overlays()}`;
  }

  function viewCashout() {
    const c = ui.cashout; const rw = c.reward;
    let k = 0; const row = (label, v) => `<div class="line rowin" style="--d:${(k++ * 0.42).toFixed(2)}s"><span>${label}</span><span class="num" data-count="${v}">+0</span></div>`;
    const rows = [row(`Thưởng ${CFG.aiNames[c.kind]}`, rw.base)];
    if (rw.unused > 0) rows.push(row(`Lượt đánh dư × ${rw.unused}`, rw.unused * rw.perUnused));
    if (rw.extra > 0) rows.push(row('Từ bùa', rw.extra));
    if (rw.interest > 0) rows.push(row(`Lãi (1 đồng mỗi ${CFG.interest.per} đồng đang giữ)`, rw.interest));
    if (rw.invest > 0) rows.push(row('Thẻ Đầu Tư', rw.invest));
    const totalDelay = (k * 0.42).toFixed(2);
    return `${topHTMLFor(c)}<div class="panel cash"><small>Chặng ${c.chang}/${CFG.changCount}</small><div class="big">Qua ${CFG.aiNames[c.kind]}!</div>
      <div class="line"><span>Điểm</span><span class="num">${fmt(c.score)} / ${fmt(c.target)}</span></div>
      ${rw.sealLevels && rw.sealLevels.length ? `<p>Triện Lam: ${rw.sealLevels.map((h) => H[h].vi).join(', ')} lên 1 cấp.</p>` : ''}
      ${rw.how === 'saved' ? '<p>Phao Cứu Sinh đã cứu ải này và tự mất.</p>' : ''}
      ${rows.join('')}<div class="line rowin total" style="--d:${totalDelay}s"><span><b>Tổng thưởng</b></span><span class="num" data-count="${rw.total}">+0</span></div>
      <button class="btn play big rowin" style="--d:${(+totalDelay + 0.5).toFixed(2)}s" data-act="cash-next" type="button">${run.phase === 'than' ? 'Chọn bùa Thần' : 'Vào chợ'}</button></div>${overlays()}`;
  }
  function topHTMLFor(c) {
    return `<div class="panel top"><div class="where"><small>Chặng ${c.chang}/${CFG.changCount}</small><b>${CFG.aiNames[c.kind]}</b><small>${CFG.difficultyPresets[run.difficultyId].vi} · ${CFG.decks[run.deckId].vi}</small></div>`
      + `<button class="mini" data-act="deck" type="button">${gicon('the_bai')}Bộ bài</button><button class="mini" data-act="info" type="button">${gicon('cuon_giay')}Bảng bộ</button><button class="mini" data-act="items" type="button">${gicon('tui_loc')}Vật phẩm${itemsBadge()}</button><div class="coin">${gicon('thoi_vang')}<span>${run.money}</span></div></div>`;
  }

  function viewThan() {
    const offers = run.thanOffers.map((id) => ({ uid: id, id, variant: null }));
    const full = run.usedSlots() >= run.slots;
    let body;
    if (ui.thanPick) {
      body = `<div class="panel shop-sec"><h3>Hết ô bùa<span class="reward">Chạm bùa muốn thay</span></h3>
        <div class="charms" style="grid-template-columns:repeat(${run.charms.length},1fr)">${run.charms.map((c) => charmHTML(c, 0).replace('data-act="charm"', 'data-act="than-replace"')).join('')}</div>
        <button class="btn discard" data-act="than-cancel" type="button">Quay lại</button></div>`;
    } else {
      body = `<div class="panel shop-sec"><h3>Chọn một bùa Thần<span class="reward">${full ? 'Ô bùa đã đầy, sẽ phải thay một bùa' : 'Còn ô trống'}</span></h3>
        <div class="offers">${offers.map((o) => `<div class="offer">${charmHTML({ ...o, state: {} }, 0, 'div')}<div class="desc">${moneyText(CH[o.id].text)}</div><button class="buy" data-act="than-pick" data-id="${o.id}" type="button">Nhận</button></div>`).join('')}</div>
        <button class="btn discard" data-act="than-skip" type="button">Bỏ qua</button></div>`;
    }
    return `${topHTMLFor(ui.cashout)}<div class="panel cash"><small>Chiến lợi phẩm</small><div class="big">Hạ trùm chặng ${ui.cashout.chang}</div><p>Bùa Thần rất mạnh và không bán ở chợ.</p></div>${body}${overlays()}`;
  }

  function viewShop() {
    const nextChang = run.aiIdx === 2 ? run.chang + 1 : run.chang;
    const nextIdx = (run.aiIdx + 1) % 3;
    const nextKind = CFG.aiKinds[nextIdx];
    const tgt = run.targetFor(nextChang, nextIdx);
    const boss = run.bosses[nextChang - 1];
    const charmOffers = run.shop.offers.filter((o) => o.kind === 'charm');
    const queOffers = run.shop.offers.filter((o) => o.kind === 'que');
    const anOffers = run.shop.offers.filter((o) => o.kind === 'an');
    const packOffers = run.shop.offers.filter((o) => o.kind === 'pack');
    const phuOffers = run.shop.offers.filter((o) => o.kind === 'phu');
    const consOffers = run.shop.offers.filter((o) => o.kind === 'cons');
    const last = ui.cashout || { chang: run.chang, kind: 'thuong' };
    const owned = run.vouchers.map((id) => PHU[id].vi).join(', ');
    return `${topHTMLFor(last)}
      <div class="panel next-boss"><small>Ải kế tiếp</small><br><b style="color:var(--gold);font-size:18px">Chặng ${nextChang} · ${CFG.aiNames[nextKind]}</b>, mục tiêu <b class="num" style="font-size:22px">${fmt(tgt)}</b>.<br>
        Trùm chặng ${nextChang}: <b>${boss.vi}</b>, ${boss.text.toLowerCase()}.</div>
      <div class="panel shop-sec"><h3>Bùa<span class="reward">Làm mới ${run.rerollCost()} đồng</span></h3>
        <div class="offers list-offers">${charmOffers.map(offerCharmHTML).join('') || '<div class="reward">Hết bùa để bán.</div>'}</div>
        <button class="btn discard" data-act="reroll" type="button" ${run.money < run.rerollCost() ? 'disabled' : ''}>${gicon('lam_moi')}Làm mới chợ<small>${run.rerollCost()} đồng · Gói và Phù giữ nguyên</small></button></div>
      <div class="panel shop-sec"><h3>Gói và Phù<span class="reward">${phuOffers.length ? 'Phù hiếm: mỗi chặng một món' : 'Hết Phù chặng này'}</span></h3>
        <div class="offers list-offers">${packOffers.map(offerPackHTML).join('')}${phuOffers.map(offerPhuHTML).join('')}</div>
        ${owned ? `<div class="reward">Phù đã có: ${owned}.</div>` : ''}</div>
      <div class="panel shop-sec cons-sec"><h3>Vật Phẩm Tiêu Hao<span class="reward">${run.consumables.length}/${run.consumableSlots} ô</span></h3><div class="offers list-offers">${consOffers.map(offerConsHTML).join('') || '<div class="reward no-offer">Chặng này không có hàng.</div>'}</div></div>
      <div class="panel shop-sec que-an-sec"><h3>Quẻ và Ấn<span class="reward">sửa bộ bài, nâng bộ</span></h3>
        <div class="offers list-offers">${queOffers.map(offerQueHTML).join('')}${anOffers.map(offerAnHTML).join('')}</div>
        <div class="reward">Giữ tiền để ăn lãi: cuối mỗi ải được 1 đồng cho mỗi ${CFG.interest.per} đồng, tối đa ${CFG.interest.cap + run.bonus('interestCapBonus')}.</div></div>
      <div class="panel shop-sec charms-sec"><h3>Bùa của bạn<span class="reward">${run.usedSlots()}/${run.slots} ô · chạm để bán hoặc đổi chỗ</span></h3>${charmsRowHTML()}</div>
      <button class="btn play big" data-act="leave-shop" type="button">Vào ải kế</button>${overlays()}`;
  }

  function viewEnd() {
    const won = run.phase === 'won'; const last = run.history[run.history.length - 1];
    const hist = run.history.map((h) => `<i class="${h.outcome === 'lose' ? 'lose' : h.kind === 'trum' ? 't' : ''}" title="Chặng ${h.chang} ${CFG.aiNames[h.kind]}: ${fmt(h.score)}/${fmt(h.target)}"></i>`).join('');
    const cleared = run.history.filter((h) => h.outcome !== 'lose').length;
    return `<div class="panel cash"><small>Kết thúc ván</small>
      <div class="big">${won ? 'Thắng rồi! Hạn Bạt đã bị hạ.' : `Dừng ở chặng ${last.chang}, ${CFG.aiNames[last.kind]}`}</div>
      ${won ? '' : `<div class="line"><span>Điểm</span><span class="num">${fmt(last.score)} / ${fmt(last.target)}</span></div>`}
      <div class="line"><span>Số ải vượt qua</span><span class="num">${cleared} / ${CFG.changCount * 3}</span></div>
      <div class="hist" aria-label="Lịch sử các ải">${hist}</div>
      <small>Bùa cuối ván</small>${run.charms.length ? `<div class="charms" style="grid-template-columns:repeat(${Math.max(5, run.charms.length)},1fr)">${run.charms.map((c) => charmHTML(c, 0, 'div')).join('')}</div>` : '<div class="reward">Không có bùa nào.</div>'}
      <div class="reward">Độ khó: ${CFG.difficultyPresets[run.difficultyId].vi} · ${CFG.decks[run.deckId].vi} · Hạt giống ván: ${run.seed}</div>
      ${ui.unlockMsg ? `<div class="unlock">${gicon('hop_qua')}<b>${ui.unlockMsg}</b></div>` : ''}
      <button class="btn play big" data-act="again" type="button">Chơi ván mới</button><button class="btn discard big" data-act="home" type="button">Chọn bộ bài và độ khó</button></div>`;
  }

  // Ấn đã dùng suy ra từ bộ bài (Ấn phù phép, Triện); Thẻ bỏ qua lấy từ lịch sử ván
  const ENH_AN = { ngoc: 'ngoc', kim: 'kim', son: 'son', thep: 'thep', linh: 'linh', luu_ly: 'luu_ly' };
  const SEAL_AN = { do: 'trien_do', vang: 'trien_vang', lam: 'trien_lam' };
  function itemsData() {
    const an = new Map();
    for (const c of run.deck) {
      if (c.enh && ENH_AN[c.enh]) an.set(ENH_AN[c.enh], (an.get(ENH_AN[c.enh]) || 0) + 1);
      if (c.seal && SEAL_AN[c.seal]) an.set(SEAL_AN[c.seal], (an.get(SEAL_AN[c.seal]) || 0) + 1);
    }
    const the = new Map();
    for (const h of run.history) if (h.outcome === 'skip' && h.tag) the.set(h.tag, (the.get(h.tag) || 0) + 1);
    return { phu: run.vouchers.slice(), an: [...an], the: [...the] };
  }
  function itemsBadge() { if (!run) return ''; const d = itemsData(); const n = d.phu.length + d.an.length + d.the.length; return n ? ` <b class="ibadge">${n}</b>` : ''; }
  function itemsOverlay() {
    const d = itemsData();
    const row = (dir, id, name, text, n) => `<li class="irow"><img class="px ic" src="assets/${dir}/${id}.png" alt="" draggable="false"><div><b>${name}${n > 1 ? ` <em>×${n}</em>` : ''}</b><span>${text}</span></div></li>`;
    const sec = (title, sub, rows) => `<div class="isec"><h3>${title}<small>${sub}</small></h3>${rows.length ? `<ul class="ilist">${rows.join('')}</ul>` : '<p class="reward">Chưa có.</p>'}</div>`;
    const phu = d.phu.map((id) => row('phu', id, PHU[id].vi, PHU[id].text, 1));
    const an = d.an.map(([id, n]) => row('an', id, AN[id].vi, AN[id].text, n));
    const the = d.the.map(([id, n]) => row('skip', id, CFG.skipTags[id].vi, CFG.skipTags[id].text, n));
    const pend = run.pendingInvest > 0 ? `<p class="reward">Thẻ Đầu Tư đang chờ: +${run.pendingInvest} đồng sau khi hạ trùm kế tiếp.</p>` : '';
    return `<div class="overlay" data-act="close-bg"><div class="panel sheet wide" role="dialog" aria-label="Vật phẩm"><h2>Vật phẩm đã có</h2>
      ${sec('Phù', 'nâng cấp vĩnh viễn', phu)}${sec('Ấn đã dùng', 'đang nằm trên lá bài (số lá)', an)}${sec('Thẻ bỏ qua', 'đã nhận trong ván', the)}${pend}
      <p class="reward">Ấn Nhân Bản, Trừ Tà, Đảo Họ sửa thẳng bộ bài nên không hiện ở đây; xem trong Bộ bài.</p>
      <button class="btn play" data-act="close" type="button">Đóng</button></div></div>`;
  }

  function overlays() {
    let out = '';
    if (ui.picker) {
      const a = AN[ui.picker.anId];
      const cards = sortDeck(run.deck).map((c) => cardHTML(c, { cls: ui.picker.sel.has(c.id) ? 'picked' : '' }).replace('class="card', 'data-act="pick" class="card')).join('');
      out += `<div class="overlay${ui.picker.still ? ' still' : ''}"><div class="panel sheet wide" data-nox role="dialog" aria-label="${a.vi}"><h2>${a.vi}</h2><p>${a.text}. Đã chọn ${ui.picker.sel.size}/${a.max}. Bộ bài hiện có ${run.deck.length} quân.</p>
        <div class="deckgrid">${cards}</div>
        <div class="row btns"><button class="btn discard" data-act="pick-cancel" type="button">Huỷ</button><button class="btn play" data-act="pick-ok" type="button" ${ui.picker.sel.size ? '' : 'disabled'}>Dùng Ấn (${ui.picker.price} đồng)</button></div></div></div>`;
    }
    if (ui.deckView) {
      const inPlay = ui.view === 'play' && run.phase === 'playing';
      const left = inPlay ? new Set(run.round.draw.map((c) => c.id)) : null;
      const groups = new Map();
      for (const c of sortDeck(run.deck)) {
        const k = [c.color, c.rank, c.enh || '', c.seal || '', c.tmp ? 't' : ''].join('|');
        const g = groups.get(k) || { c, n: 0, left: 0 }; g.n++; if (left && left.has(c.id)) g.left++; groups.set(k, g);
      }
      const cards = [...groups.values()].map((g) => `<div class="dgroup">${cardHTML(g.c, { cls: left && g.left === 0 ? 'used' : '', noDeb: true })}<b class="cbadge">${left ? `${g.left}/${g.n}` : '×' + g.n}</b></div>`).join('');
      out += `<div class="overlay" data-act="close-bg"><div class="panel sheet wide" role="dialog" aria-label="Bộ bài"><h2>Bộ bài (${run.deck.length} quân, ${groups.size} loại)</h2>
        <p class="reward">${inPlay ? `Số nhỏ là còn bao nhiêu bản chưa rút trong ải này (còn/tổng); lá mờ là đã hết. Còn ${left.size} quân chưa rút.` : 'Bộ bài dùng cho mọi ải. Ấn ở chợ sẽ sửa bộ bài này.'}</p>
        <div class="deckgrid">${cards}</div><button class="btn play" data-act="close" type="button">Đóng</button></div></div>`;
    }
    if (ui.settings) out += settingsOverlay();
    if (ui.items) out += itemsOverlay();
    if (ui.detail != null) {
      const i = run.charms.findIndex((c) => c.uid === ui.detail);
      if (i < 0) ui.detail = null;
      else {
        const c = run.charms[i]; const info = CH[c.id]; const v = c.variant ? CFG.variants[c.variant] : null;
        const live = c.state && c.state.mult > 0 && (c.id === 'tot_thi' || c.id === 'ma_tang_toc') ? `<p>Đang cộng <b>+${c.state.mult}</b> hệ số.</p>` : '';
        out += `<div class="overlay" data-act="close-bg"><div class="panel sheet" role="dialog" aria-label="${info.vi}">
          <div class="row" style="align-items:center"><span class="tag ${info.rarity}">${RARITY[info.rarity]}</span><span class="tag" style="background:var(--lacquer2);color:var(--muted)">${BUILD[info.build]}</span></div>
          <h2>${info.vi}</h2><p>${moneyText(info.text)}</p>${v ? `<p><b>${v.vi}:</b> ${v.text}</p>` : ''}${live}
          <p class="reward">Thứ tự hiện tại: ô ${i + 1}. Bùa bên trái được tính trước.</p>
          <div class="row btns"><button class="btn discard" data-act="move-l" type="button" ${i === 0 ? 'disabled' : ''}>◀ Sang trái</button><button class="btn discard" data-act="move-r" type="button" ${i === run.charms.length - 1 ? 'disabled' : ''}>Sang phải ▶</button></div>
          <div class="row btns"><button class="btn red" data-act="sell" type="button">Bán +${c.sell}</button><button class="btn discard" data-act="close" type="button">Đóng</button></div></div></div>`;
      }
    }
    if (ui.info) {
      const rows = Object.keys(H).map((id) => {
        const h = H[id]; const lv = run.handLevels[id];
        const val = `${h.chips + (lv - 1) * h.lvChips} × ${h.mult + (lv - 1) * h.lvMult}`;
        const meta = `Cấp ${lv}${ui.playCount[id] ? ' · đã đánh ' + ui.playCount[id] : ''}`;
        const tier = HAND_TIER[id];
        return `<li class="hrow${lv > 1 ? ' up' : ''}"><div class="hn"><b><span class="htier t${tier}">${TIER_ICON[tier]||tier}</span> ${h.vi}</b><span>${h.desc}</span></div><div class="hv"><b class="num">${val}</b><small>${meta}</small></div></li>`;
      }).join('');
      out += `<div class="overlay" data-act="close-bg"><div class="panel sheet wide" role="dialog" aria-label="Bảng bộ"><h2>Bảng bộ</h2>
        <p class="reward">Xếp từ mạnh đến yếu. Số in đậm là <b>chip × hệ số</b> hiện tại. Game tự lấy bộ điểm cao nhất; lá ngoài bộ không ghi điểm.</p>
        <ul class="hlist">${rows}</ul>
        ${run.vouchers.length ? `<p class="reward"><b>Phù đã có:</b> ${run.vouchers.map((id) => PHU[id].vi + ' (' + PHU[id].text + ')').join('; ')}.</p>` : ''}
        <div class="row btns"><button class="btn play" data-act="close" type="button">Đóng</button></div></div></div>`;
    }
    return out.replace(/(<div class="panel sheet[^"]*" role="dialog" aria-label="[^"]*">)/g, '$1<button class="sx" data-act="close" type="button" aria-label="Đóng">×</button>');
  }

  // ------------------------------------------------------------------ vẽ lại và cập nhật nhỏ
  function render() {
    hideTip();
    let html = '';
    const sel = ui.view === 'play' && ui.intro;
    if (ui.view === 'achievements') html = viewAchievements();
    else if (ui.view === 'title' || !run) html = viewTitle();
    else if (sel) html = viewSelect();
    else if (ui.view === 'play') html = viewPlay();
    else if (ui.view === 'cashout') html = viewCashout();
    else if (ui.view === 'than') html = viewThan();
    else if (ui.view === 'shop') html = viewShop();
    else if (ui.view === 'pack') html = viewPack();
    else if (ui.view === 'end') html = viewEnd();
    else if (ui.view === 'skip') html = viewSkip();

  }
  let devEl = null;
  function devHTML() {

    const d = (ok) => (ok ? '' : ' disabled');

      <label class="dev-chk"><input type="checkbox" data-dev="unlock" ${settings.devUnlock ? 'checked' : ''}> Mở khóa mọi độ khó và bộ bài</label>

      </div>

  function updateDev() {
    if (!settings.dev) { if (devEl) { devEl.remove(); devEl = null; document.body.classList.remove('dev-open'); fit(); } return; }

      devEl = document.createElement('div'); devEl.id = 'dev'; document.body.appendChild(devEl);

        else if (e.target.dataset.dev === 'unlock') { settings.devUnlock = e.target.checked; saveSettings(); sanitizeSel(); if (ui.view === 'title') render(); else updateDev(); }
      });
    }

    document.body.classList.toggle('dev-open', !!settings.devOpen); fit();

  }
  function onDevClick(e) {
    const t = e.target.closest('[data-dev]'); if (!t || t.tagName === 'INPUT') return;

      case 'fold': settings.devOpen = !settings.devOpen; saveSettings(); updateDev(); return;
      case 'off': settings.dev = false; saveSettings(); updateDev(); if (ui.settings || ui.view === 'title') render(); return;
      case 'money': run.money += 100; break;
      case 'hand': run.round.handsLeft++; break;
      case 'disc': run.round.discardsLeft++; break;
      case 'clear': if (run.round.hand.length) { ui.sel = new Set([run.round.hand[0].id]); run.round.score = run.round.target; doPlay(); } return;
      case 'unlockhands': for (const id of Object.keys(run.handLevels)) if (run.handLevels[id] === 0) run.handLevels[id] = 1; break;
      case 'levelall': for (const id of Object.keys(run.handLevels)) { if (run.handLevels[id] === 0) run.handLevels[id] = 1; run.levelUp(id); } break;

      case 'jump': { const n = +(ui.devChang || 1); run.chang = n; run.aiIdx = 0; run.startAi(); ui.view = 'play'; ui.intro = true; ui.sel.clear(); ui.known = new Set(); break; }
      case 'progall': progress.decks = DECK_ORDER.length; DECK_ORDER.forEach((id) => { progress.diff[id] = DIFF_ORDER.length; }); store.set('progress', progress); break;

  });

  // ------------------------------------------------------------------ cài đặt, mở đầu, hướng dẫn

  const music = { el: null, gain: null };
  const musicLevel = () => settings.musicVol / 100;

        music.gain = actx.createGain();
        src.connect(music.gain);
        music.gain.connect(actx.destination);

  }

      <div class="srow"><div><b>Mở đầu và hướng dẫn</b><span>Xem lại câu chuyện, hoặc hướng dẫn trong ván</span></div><div class="chips"><button class="mini" data-act="replay-story" type="button">${gicon('cuon_giay')}Mở đầu</button><button class="mini" data-act="replay-tut" type="button">${gicon('den_long')}Hướng dẫn</button></div></div>

  root.addEventListener('input', (e) => {

  });
  root.addEventListener('change', (e) => { if (e.target.id === 'set-vol' || e.target.id === 'set-mvol') { saveSettings(); unlockAudio(); if (e.target.id === 'set-vol') { if (!playSfx('card_select', 0.7) && actx) blip(660, 0.08, 'triangle', 0.08); } } });
  function clearAllData() {
    clearTimeout(saveTimer); stopTutorial(false); closeStory(); musicStop();
    ['save', 'settings', 'storySeen', 'tutDone', 'tutForce', 'runsStarted', 'progress'].forEach((k) => store.set(k, null));
    progress.decks = 1; progress.diff = {};
    Object.assign(settings, { musicOn: true, musicVol: 30, sfxOn: true, sfxVol: 85, reduce: false, layout: 'auto', dev: false, devUnlock: true, devOpen: true }); ui.difficulty = DIFF_ORDER[0]; ui.deck = DECK_ORDER[0];

  // Mở đầu: màn chạm để bắt đầu, rồi ba thẻ lời Phỗng (GDD mục 4). Chỉ tự hiện lần đầu.
  const STORY = [
    { bg: 1, text: 'Từ đợt sập nguồn, ký ức của cả dân làng bị nén hết vào 120 lá bài Tổ tôm. Gọi là hồn làng…' },
    { bg: 4, text: 'Server của đình làng vừa dính virus Nhà Cái. Nó bắt cóc hồn làng làm con tin, muốn chuộc thì phải đánh bài thắng nó. Hết bài, còn hồn…' },
    { bg: 8, text: 'Ta là Phỗng. Tượng đá canh đình làng. Ta chọn ngươi chơi cùng. Cố mà qua 8 chặng, đập 12 con bug với trùm cuối Hạn Bạt. Nhận bài đi!' },

  let storyEl = null;
  function closeStory() { if (storyEl) { storyEl.remove(); storyEl = null; document.removeEventListener('keydown', storyKey); } }
  function storyKey(e) {
    if (!storyEl) return;

  }
  function finishStory() { store.set('storySeen', true); closeStory(); }
  function showStory() {

    let i = -1; let busy = false;

      if (i < 0) {
        setBg(1);
        el.innerHTML = `<button class="mini st-skip" data-st="skip" type="button">Bỏ qua</button><div class="st-splash"><img class="st-logo" src="assets/brand/logo.png" alt="PHỖNG.EXE, game xếp bài Tổ Tôm" draggable="false"><p class="st-tap">Chạm để bắt đầu</p></div>`;
        return;
      }
      const s = STORY[i];

        <div class="st-box"><img class="st-face" src="assets/brand/app_icon.png" alt="" draggable="false"><div><b class="st-name">Phỗng</b><p class="st-text" aria-live="polite">${s.text}</p></div></div>

    };
    const goNext = () => {
      if (busy) return;
      busy = true;

      setTimeout(() => { i++; el.classList.remove('st-leaving'); draw(); busy = false; }, 220);
    };
    el.addEventListener('click', (e) => {
      const a = e.target.closest('[data-st]');
      if (a && a.dataset.st === 'skip') { finishStory(); return; }
      if (i >= STORY.length - 1) { finishStory(); return; }

    });

  }

  // Hướng dẫn trong ván: các thẻ chỉ vào từng vùng, không chặn thao tác. Hiện lần đầu vào ải; bật lại ở Cài đặt.
  const TUT = [
    { sel: '.target', text: 'Mục tiêu của ải: ghi đủ số điểm này trước khi hết lượt đánh.' },
    { sel: '#hand', text: 'Chạm quân bài để chọn, tối đa 5 quân. Chạm lại để bỏ chọn. Nhấn giữ để xem chú giải.' },
    { sel: '.calc', text: 'Điểm = chip (ô xanh) nhân hệ số (ô đỏ). Bộ càng hiếm càng mạnh; xem đủ ở nút Bảng bộ.' },
    { sel: '#btnPlay', text: 'Chọn xong thì bấm Đánh. Chỉ quân thuộc bộ mới ghi điểm.' },
    { sel: '#btnDis', text: 'Quân xấu thì Bỏ bài để rút quân mới. Số lượt bỏ có hạn.' },
    { sel: '#charms', text: 'Bùa nằm ở hàng này. Mua ở chợ sau mỗi ải; bùa tính từ trái sang phải nên thứ tự là chiến thuật.' },
  ];
  let tutEl = null; let tutRaf = 0;
  function stopTutorial(done) {
    if (done) { store.set('tutDone', true); store.set('tutForce', false); }
    cancelAnimationFrame(tutRaf); if (tutEl) { tutEl.remove(); tutEl = null; }
  }
  function startShopTutorial() {
    if (!isHintMode() || store.get('shopTutDone') || ui.view !== 'shop') return;
    stopTutorial(false);
    const visible = (sel) => { const t = $(sel); if (!t) return null; const r = t.getBoundingClientRect(); return r.width > 4 && r.height > 4 ? t : null; };
    const shopSteps = [
      { sel: '.shop-sec', text: 'Chào mừng đến Chợ! Mua Bùa để tăng điểm, Quẻ/Ấn để nâng cấp bộ bài, Vật Phẩm để dùng trong ải.' },
      { sel: '.offers .offer', text: 'Chạm vào món để xem chi tiết. Giá tiền hiển thị trên nút mua. Dùng Làm mới để xáo chợ nếu không thấy gì phù hợp.' },
      { sel: '.charms-sec', text: 'Bùa đã mua xếp ở đây. Bùa tính từ trái sang phải – thứ tự là chiến thuật!' },
      { sel: 'button[data-act="leave-shop"]', text: 'Mua xong, nhấn đây để tiến vào ải kế tiếp. Chúc may mắn!' },
    ].filter((s) => visible(s.sel));
    if (!shopSteps.length) { store.set('shopTutDone', true); return; }
    let k = 0;
    const el = tutEl = document.createElement('div'); el.className = 'tut'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Hướng dẫn chợ');
    el.innerHTML = '<div class="tut-ring"></div><div class="tut-tip"><img class="tut-face" src="assets/brand/app_icon.png" alt=""><div class="tut-body"><p class="tut-text"></p><div class="tut-foot"><small class="tut-n"></small><span><button class="mini" data-tut="skip" type="button">Bỏ qua</button><button class="mini on" data-tut="next" type="button"></button></span></div></div></div>';
    document.body.appendChild(el);
    const ring = $('.tut-ring', el), tip = $('.tut-tip', el);
    const show = () => { $('.tut-text', el).textContent = shopSteps[k].text; $('.tut-n', el).textContent = `${k + 1}/${shopSteps.length}`; $('[data-tut=next]', el).textContent = k === shopSteps.length - 1 ? 'Xong' : 'Tiếp'; };
    el.addEventListener('click', (e) => {
      const a = e.target.closest('[data-tut]'); if (!a) return;
      if (a.dataset.tut === 'skip' || k >= shopSteps.length - 1) { store.set('shopTutDone', true); stopTutorial(false); return; }
      k++; blip(520, 0.05, 'square', 0.03); show();
    });
    const place = () => {
      if (!tutEl) return;
      const t = $(shopSteps[k].sel);
      if (!t || ui.view !== 'shop') { stopTutorial(false); return; }
      const r = t.getBoundingClientRect(), pad = 5;
      ring.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`;
      const th = tip.offsetHeight, tw = tip.offsetWidth, vw = innerWidth, vh = innerHeight;
      let y = r.bottom + 14; if (y + th > vh - 8) y = r.top - th - 14; if (y < 8) y = Math.max(8, Math.min(vh - th - 8, r.top + 10));
      const x = Math.max(8, Math.min(vw - tw - 8, r.left + r.width / 2 - tw / 2));
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
      tutRaf = requestAnimationFrame(place);
    };
    show(); place();
  }
  function startTutorial() {
    stopTutorial(false);
    const visible = (sel) => { const t = $(sel); if (!t) return null; const r = t.getBoundingClientRect(); return r.width > 4 && r.height > 4 ? t : null; };

    // Kịch bản ván đầu: chỉ vào bộ bài cụ thể trên tay để người mới biết cách ghép
    const extraSteps = [];
    if (store.get('runsStarted', 0) <= 1 && run && run.round && run.round.hand.length) {
      const hand = run.round.hand;
      const byRank = {};
      for (const c of hand) if (c.rank !== 'junk') (byRank[c.rank] = byRank[c.rank] || []).push(c);
      let pairRank = null; let isSamePair = false;
      // Ưu tiên pair_same (cùng họ) hơn pair_mixed để demo bộ mạnh hơn
      for (const [rank, cs] of Object.entries(byRank)) {
        if (cs.length >= 2) {
          const byCol = {};
          for (const c of cs) (byCol[c.color] = byCol[c.color] || []).push(c);
          if (Object.values(byCol).some((g) => g.length >= 2)) { pairRank = rank; isSamePair = true; break; }
          if (!pairRank) { pairRank = rank; isSamePair = false; }
        }
      }
      extraSteps.push({ sel: '#hand', text: 'Ván đầu tiên! Mỗi lượt chọn 2–5 lá rồi nhấn Đánh — trò chơi tự ghép bộ điểm cao nhất từ các lá bạn chọn.' });
      if (pairRank) {
        const pairName = isSamePair ? 'Đôi cùng họ (mạnh hơn)' : 'Đôi khác họ';
        extraSteps.push({ sel: '#hand', text: `Trên tay có 2 lá ${R[pairRank].vi} → ${pairName}! Chọn cả hai lá đó rồi nhấn Đánh để ghi điểm đầu tiên.` });
      }
    }

    const steps = [...extraSteps, ...TUT].filter((s) => visible(s.sel));
    if (!steps.length) return;
    let k = 0;
    const el = tutEl = document.createElement('div'); el.className = 'tut'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Hướng dẫn');
    el.innerHTML = '<div class="tut-ring"></div><div class="tut-tip"><img class="tut-face" src="assets/brand/app_icon.png" alt=""><div class="tut-body"><p class="tut-text"></p><div class="tut-foot"><small class="tut-n"></small><span><button class="mini" data-tut="skip" type="button">Bỏ qua</button><button class="mini on" data-tut="next" type="button"></button></span></div></div></div>';
    document.body.appendChild(el);
    const ring = $('.tut-ring', el), tip = $('.tut-tip', el);
    const show = () => { $('.tut-text', el).textContent = steps[k].text; $('.tut-n', el).textContent = `${k + 1}/${steps.length}`; $('[data-tut=next]', el).textContent = k === steps.length - 1 ? 'Xong' : 'Tiếp'; };
    el.addEventListener('click', (e) => {
      const a = e.target.closest('[data-tut]'); if (!a) return;
      if (a.dataset.tut === 'skip' || k >= steps.length - 1) { stopTutorial(true); return; }
      k++; blip(520, 0.05, 'square', 0.03); show();
    });
    const place = () => {
      if (!tutEl) return;
      const t = $(steps[k].sel);
      if (!t || ui.view !== 'play' || ui.intro) { stopTutorial(false); return; }
      const r = t.getBoundingClientRect(), pad = 5;
      ring.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`;
      const th = tip.offsetHeight, tw = tip.offsetWidth, vw = innerWidth, vh = innerHeight;
      let y = r.bottom + 14; if (y + th > vh - 8) y = r.top - th - 14; if (y < 8) y = Math.max(8, Math.min(vh - th - 8, r.top + 10));
      const x = Math.max(8, Math.min(vw - tw - 8, r.left + r.width / 2 - tw / 2));
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
      tutRaf = requestAnimationFrame(place);
    };
    show(); place();
  }
  function maybeTutorial() { if (!FAST && !store.get('tutDone', false) && (store.get('runsStarted', 0) <= 1 || store.get('tutForce', false)) && ui.view === 'play' && !ui.intro) startTutorial(); }

  // chạm vào bất kỳ đâu: tắt các thông báo tạm (bảng bộ mạnh, thông báo ải, chú giải, tin nhắn)
  document.addEventListener('pointerdown', () => { $$('.fanfare, .fandim, .banner, .bandim, .lvup, .toast, .float').forEach((e) => e.remove()); hideTip(); }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    $$('.fanfare, .fandim, .banner, .bandim, .lvup, .toast').forEach((x) => x.remove()); hideTip();
    if (ui.info || ui.deckView || ui.items || ui.settings || ui.detail != null) { ui.info = false; ui.deckView = false; ui.items = false; ui.settings = false; ui.confirmClear = false; ui.detail = null; render(); }
  });

  // ------------------------------------------------------------------ iOS install banner
  (function iosInstallBanner() {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (!isIOS || isStandalone) return;
    if (store.get('iosBannerDismissed', false)) return;
    const bar = document.createElement('div');
    bar.className = 'ios-banner';
    bar.innerHTML = '<span>Nhấn <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polyline points="8 6 12 2 16 6"/><line x1="12" y1="2" x2="12" y2="16"/><polyline points="6 18 18 18"/><polyline points="4 20 20 20"/></svg> rồi chọn <b>Thêm vào MH chính</b> để lưu game</span><button class="ios-banner-x" type="button" aria-label="Đóng">✕</button>';
    document.body.appendChild(bar);
    bar.querySelector('.ios-banner-x').addEventListener('click', () => { bar.remove(); store.set('iosBannerDismissed', true); });
  })();

  // ------------------------------------------------------------------ khởi động
  applySettings();
  setLayout();
  window.addEventListener('resize', () => { setLayout(); fit(); });
  render();
  if (!FAST && !store.get('storySeen', false)) showStory();
  window.__tc = { get run() { return run; }, ui, render, music, get actx() { return actx; }, recordWin, progress, settings, fanfare, blindBanner }; window.__tcData = DATA;
})();

</script>
